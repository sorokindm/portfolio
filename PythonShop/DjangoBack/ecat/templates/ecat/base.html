{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="{%static 'ecat/styles.css'%}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
    class="bi bi-box2" viewBox="0 0 16 16">
    <symbol id="easyeshop" viewBox="0 0 16 16">
      <title>EasyEShop</title>
      <path
        d="M2.95.4a1 1 0 0 1 .8-.4h8.5a1 1 0 0 1 .8.4l2.85 3.8a.5.5 0 0 1 .1.3V15a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V4.5a.5.5 0 0 1 .1-.3zM7.5 1H3.75L1.5 4h6zm1 0v3h6l-2.25-3zM15 5H1v10h14z" />
    </symbol>
  </svg>

  <svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
    class="bi bi-cart" viewBox="0 0 16 16">
    <symbol id="cart" viewBox="0 0 16 16">
      <path
        d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2" />
    </symbol>
  </svg>

  <svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
    class="bi bi-trash" viewBox="0 0 16 16">
    <symbol id="trash" viewBox="0 0 16 16">
      <path
        d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z" />
      <path
        d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z" />
    </symbol>
  </svg>

  <svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
    class="bi bi-plus-lg" viewBox="0 0 16 16">
    <symbol id="plus" viewBox="0 0 16 16">
      <path fill-rule="evenodd"
        d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2" />
    </symbol>
  </svg>

  <svg style="display:none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
    class="bi bi-dash-lg" viewBox="0 0 16 16">
    <symbol id="minus" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M2 8a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 8" />
    </symbol>
  </svg>

  <header>
    <div class="px-3 py-2 text-bg-dark border-bottom">
      <div class="container p-0">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
          <a href="/"
            class="hover-effect d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
            <svg class="me-2" width="40" height="32" role="img" aria-label="EasyEShop">
              <use href="#easyeshop"></use>
            </svg>
            <span class="fs-4">EasyEShop</span>
          </a>
          <!-- <form class="ms-4" role="search">
            <input type="search" class="form-control" placeholder="Search..." aria-label="Search" />
          </form> -->
          <div class="cart-bubble-wrapper">
            <a class="nostyle" href="/cart"><svg class="hover-effect ms-4" width="40" height="32" role="img">
                <use href="#cart" />
              </svg></a>
            <div id="cart-bubble">
              <span>{{cart|length}}</span>
            </div>
          </div>
          {% if request.user.is_authenticated %}
          <div class="ms-4 drop">
            
          </div>
          <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
              aria-expanded="false">
              {{request.user}}
            </button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="/lk/orders">Заказы</a></li>
              <li><a class="dropdown-item" href="/lk/logout">Выйти</a></li>
            </ul>
          </div>
          {% else %}
          <div class="ms-4">
            <a class="hover-effect text-white text-decoration-none" href="/lk/login">Войти</a>
          </div>
          {% endif %}

          {% block register %}
          {% endblock %}
        </div>
      </div>
    </div>
  </header>
  {% block merch %}
  {% endblock %}

  {% block js %}
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{%static 'el-pagination/js/el-pagination.js'%}"></script>
  <script>
    $.endlessPaginate({
      paginateOnScroll: true,
      paginateOnScrollMargin: 100,
    });
  </script>
  {% endblock %}

  <script src="{% static 'ecat/script.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>

</html>
